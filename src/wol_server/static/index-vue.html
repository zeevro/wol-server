<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wake-on-LAN</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <script type="module" src="/static/app-vue.js"></script>
  </head>
  <body id="app">
    <h1>Wake-on-LAN</h1>
    <table>
      <tr>
        <th>Name</th>
        <th>IP</th>
        <th>Actions</th>
      </tr>
      <tr v-for="target in targets">
        <td><span v-bind:class="['status-led', { alive: target.isAlive }]">&#x2B24</span>{{ target.name }}</td>
        <td>{{ target.ip }}</td>
        <td>
          <button v-on:click="checkAlive(target)">Check</button>
          <button v-on:click="wake(target)">Wake</button>
        </td>
      </tr>
    </table>
  </body>
</html>
