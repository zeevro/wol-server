# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-json" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "pretty-format-json", args = ["--autofix", "--no-sort-keys", "--no-ensure-ascii"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.7"
hooks = [
    { id = "ruff-check", args = ["--fix"] },
    { id = "ruff-format" },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "ty",
        name = "ty check",
        language = "system",
        entry = "uv run --with=ty ty check",
        pass_filenames = false,
        types = ["python"]
    },
]

[[repos]]
repo = "https://github.com/Mateusz-Grzelinski/actionlint-py"
rev = "v1.7.11.24"
hooks = [
    { id = "actionlint", additional_dependencies = ["pyflakes>=3.0.1"], args = ["-shellcheck="] },
]

[[repos]]
repo = "https://github.com/zeevro/pyproject-toml-format"
rev = "v0.0.4"
hooks = [
    { id = "pyproject-toml-format", additional_dependencies = ["ruff"] },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "config-json-schema",
        name = "config-json-schema",
        language = "system",
        entry = "uv run scripts/make_config_json_schema.py",
        pass_filenames = false
    },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v0.9.9"
hooks = [
    { id = "tombi-format" },
    { id = "tombi-lint" },
]

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.4.9"
hooks = [
    { id = "biome-check" },
]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.37.1"
hooks = [
    { id = "check-metaschema" },
]
